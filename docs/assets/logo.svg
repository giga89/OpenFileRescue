<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Concept 1: "The Healed File" (Reconstruction of Corrupted Data) -->
  <defs>
    <linearGradient id="p1_grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="60%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#FBBC05"/>
    </linearGradient>
    <filter id="p1_shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Dark container for contrast -->
  <rect width="512" height="512" rx="100" fill="#0f172a"/>

  <!-- Left: Fragmented / Corrupted Data Blocks (Lost Sectors) -->
  <g fill="#475569" opacity="0.6">
    <rect x="70" y="320" width="22" height="22" rx="4"/>
    <rect x="102" y="350" width="26" height="26" rx="4"/>
    <rect x="74" y="380" width="20" height="20" rx="4"/>
    <rect x="110" y="290" width="18" height="18" rx="4"/>
    <rect x="80" y="260" width="16" height="16" rx="3"/>
  </g>
  <!-- Animated / Recovering Data Blocks -->
  <rect x="120" y="330" width="24" height="24" rx="4" fill="#4285F4"/>
  <rect x="140" y="370" width="26" height="26" rx="4" fill="#34A853"/>
  <rect x="110" y="405" width="22" height="22" rx="4" fill="#EA4335"/>

  <!-- Main Reconstructed File Document (Angled & Elevated) -->
  <g transform="translate(170, 75)" filter="url(#p1_shadow)">
    <!-- Base Document -->
    <path d="M 0 24 C 0 10.7 10.7 0 24 0 L 160 0 L 230 70 L 230 336 C 230 349.3 219.3 360 206 360 L 24 360 C 10.7 360 0 349.3 0 336 Z" fill="#F8FAFC"/>
    
    <!-- Folded Corner (Google Amber) -->
    <path d="M 160 0 L 160 54 C 160 62.8 167.2 70 176 70 L 230 70 Z" fill="#FBBC05"/>

    <!-- Recovered Photo Inside Document -->
    <g transform="translate(35, 110)">
      <rect width="160" height="130" rx="12" fill="#E2E8F0"/>
      <!-- Sun -->
      <circle cx="125" cy="38" r="16" fill="#FBBC05"/>
      <!-- Mountains / Landscapes -->
      <path d="M 15 130 L 65 65 A 6 6 0 0 1 75 65 L 125 130 Z" fill="#4285F4"/>
      <path d="M 70 130 L 105 80 A 6 6 0 0 1 115 80 L 150 130 Z" fill="#34A853"/>
    </g>

    <!-- Success / Verification Pulse Bar -->
    <rect x="35" y="270" width="160" height="14" rx="7" fill="#E2E8F0"/>
    <rect x="35" y="270" width="125" height="14" rx="7" fill="#34A853"/>
    <rect x="35" y="300" width="100" height="14" rx="7" fill="#CBD5E1"/>
  </g>

  <!-- Dynamic Recovery Swoosh / Restore Arrow Sweeping Over File -->
  <path d="M 60 410 C 80 470 200 480 290 440 C 370 405 440 310 440 210 C 440 140 400 90 350 70" fill="none" stroke="url(#p1_grad)" stroke-width="22" stroke-linecap="round"/>
  <!-- Arrow Head -->
  <polygon points="370,45 330,75 365,100" fill="#FBBC05"/>
</svg>
