<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="900" height="560" rx="14" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Bar -->
  <rect width="900" height="36" rx="14" fill="#0f172a"/>
  <rect y="26" width="900" height="10" fill="#0f172a"/>
  <circle cx="20" cy="18" r="5.5" fill="#ef4444"/>
  <circle cx="38" cy="18" r="5.5" fill="#f59e0b"/>
  <circle cx="56" cy="18" r="5.5" fill="#10b981"/>
  <text x="450" y="23" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" text-anchor="middle" font-weight="500">bash — openfilerescue --scan D:\ --out ./recovered_sd</text>

  <!-- Terminal Body Content -->
  <g transform="translate(30, 60)" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12">
    <!-- Command Prompt -->
    <text x="0" y="16" fill="#10b981" font-weight="700">user@workstation<tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~/recupero_foto</tspan><tspan fill="#f8fafc">$</tspan> <tspan fill="#f8fafc">python run.py --scan D:\ --out ./recovered_sd --org by_type</tspan></text>

    <!-- ASCII Logo -->
    <g transform="translate(0, 32)" fill="#38bdf8" font-size="11" font-weight="700">
      <text x="0" y="14">  ___                   _____ _ _        ____                                </text>
      <text x="0" y="27"> / _ \ _ __   ___ _ __ |  ___(_) | ___  |  _ \ ___  ___  ___ _   _  ___      </text>
      <text x="0" y="40">| | | | '_ \ / _ \ '_ \| |_  | | |/ _ \ | |_) / _ \/ __|/ __| | | |/ _ \     </text>
      <text x="0" y="53">| |_| | |_) |  __/ | | |  _| | | |  __/ |  _ &lt;  __/\__ \ (__| |_| |  __/     </text>
      <text x="0" y="66"> \___/| .__/ \___|_| |_|_|   |_|_|\___| |_| \_\___||___/\___|\__,_|\___|     </text>
      <text x="0" y="79">      |_|                                                                    </text>
      <text x="0" y="96" fill="#10b981">        OpenFileRescue - Open-Source Data Recovery (100% Free &amp; Unlimited)</text>
    </g>

    <!-- Target Media Info Box -->
    <g transform="translate(0, 160)">
      <text x="0" y="14" fill="#64748b">[INFO]</text>
      <text x="55" y="14" fill="#94a3b8">Target Volume:</text>
      <text x="185" y="14" fill="#38bdf8" font-weight="700">\\.\D: [Kids Camera] (FAT32, 29.11 GB)</text>

      <text x="0" y="32" fill="#64748b">[INFO]</text>
      <text x="55" y="32" fill="#94a3b8">Output Directory:</text>
      <text x="185" y="32" fill="#f8fafc">./recovered_sd/ (Organization: by_type)</text>

      <text x="0" y="50" fill="#64748b">[INFO]</text>
      <text x="55" y="50" fill="#94a3b8">Access Mode:</text>
      <text x="185" y="50" fill="#10b981" font-weight="700">STRICT READ-ONLY (Safe Mode Active)</text>

      <text x="0" y="68" fill="#64748b">[INFO]</text>
      <text x="55" y="68" fill="#94a3b8">Engaged Parsers:</text>
      <text x="185" y="68" fill="#f8fafc">JPEG, PNG, Camera RAW, MP4/MOV, AVI, PDF, ZIP, Audio</text>
    </g>

    <!-- Progress Bar Section -->
    <g transform="translate(0, 255)">
      <text x="0" y="14" fill="#f59e0b" font-weight="700">[SCANNING]</text>
      
      <!-- Progress Bar Track -->
      <rect x="90" y="2" width="400" height="14" rx="3" fill="#1e293b"/>
      <rect x="90" y="2" width="400" height="14" rx="3" fill="#10b981"/>
      
      <text x="505" y="14" fill="#10b981" font-weight="700">100.0%</text>
      <text x="575" y="14" fill="#38bdf8">18.2 MB/s</text>
      <text x="670" y="14" fill="#94a3b8">ETA: 00m 00s</text>

      <text x="90" y="36" fill="#94a3b8">Scanned: 29.11 GB / 29.11 GB | Bad Sectors: <tspan fill="#10b981">0</tspan></text>
      <text x="90" y="54" fill="#94a3b8">Files Found: <tspan fill="#10b981" font-weight="700">1,392</tspan> (1,391 JPG, 1 AVI) | Total Recovered: <tspan fill="#38bdf8" font-weight="700">980.3 MB</tspan></text>
    </g>

    <!-- Final Summary Box -->
    <g transform="translate(0, 345)">
      <rect x="0" y="0" width="840" height="110" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="20" y="26" fill="#10b981" font-weight="700">======================================================================</text>
      <text x="20" y="44" fill="#34d399" font-weight="700"> ✓ DATA RECOVERY MISSION COMPLETED SUCCESSFULLY!</text>
      <text x="20" y="62" fill="#94a3b8"> - JPEGs Recovered: <tspan fill="#f8fafc" font-weight="700">1,391 intact photos</tspan> (960.8 MB, 48MP EXIF metadata extracted)</text>
      <text x="20" y="78" fill="#94a3b8"> - Videos Recovered: <tspan fill="#f8fafc" font-weight="700">1 AVI video</tspan> (19.5 MB, 640x480 @ 30 FPS, duration 41.0s)</text>
      <text x="20" y="96" fill="#94a3b8"> - Output saved to:  <tspan fill="#38bdf8">/home/ubuntu/recupero_foto/recovered_sd/</tspan> (Zero errors)</text>
    </g>
  </g>
</svg>
