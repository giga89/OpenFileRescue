<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Concept 4: "The Sector Scanner & Resurrected Media" -->
  <defs>
    <linearGradient id="p4_scan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34A853" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="p4_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="100" fill="#0f172a"/>

  <!-- Radar / Sector Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1e293b" stroke-width="4"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="4"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Radar Scan Sweep Beam -->
  <path d="M 256 256 L 390 100 A 210 210 0 0 0 100 130 Z" fill="url(#p4_scan)"/>
  <line x1="256" y1="256" x2="390" y2="100" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>

  <!-- Unallocated Matrix Sectors (Dots / Blocks) -->
  <g fill="#334155" opacity="0.4">
    <rect x="120" y="320" width="18" height="18" rx="4"/>
    <rect x="150" y="320" width="18" height="18" rx="4"/>
    <rect x="120" y="350" width="18" height="18" rx="4"/>
    <rect x="340" y="320" width="18" height="18" rx="4"/>
    <rect x="370" y="320" width="18" height="18" rx="4"/>
    <rect x="370" y="350" width="18" height="18" rx="4"/>
  </g>

  <!-- Discovered / Resurrected Media Document (Center) -->
  <g transform="translate(176, 150)" filter="url(#p4_glow)">
    <!-- Main Photo Card -->
    <path d="M 0 20 C 0 9 9 0 20 0 L 110 0 L 160 50 L 160 192 C 160 203 151 212 140 212 L 20 212 C 9 212 0 203 0 192 Z" fill="#F8FAFC"/>
    <path d="M 110 0 L 110 38 C 110 44.6 115.4 50 122 50 L 160 50 Z" fill="#FBBC05"/>

    <!-- Recovered Photo Inside -->
    <g transform="translate(24, 60)">
      <rect width="112" height="90" rx="8" fill="#E2E8F0"/>
      <!-- Sun -->
      <circle cx="86" cy="26" r="11" fill="#FBBC05"/>
      <!-- Mountains -->
      <path d="M 10 90 L 45 45 A 4 4 0 0 1 51 45 L 86 90 Z" fill="#4285F4"/>
      <path d="M 48 90 L 72 58 A 4 4 0 0 1 78 58 L 102 90 Z" fill="#34A853"/>
    </g>

    <!-- Glowing Checkmark / Success Badge -->
    <circle cx="140" cy="180" r="22" fill="#34A853"/>
    <path d="M 130 180 L 137 187 L 151 173" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
