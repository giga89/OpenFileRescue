        <polygon points="124,92 148,105 124,118" fill="#ffffff"/>
        <rect x="20" y="20" width="70" height="22" rx="4" fill="#0f172a" fill-opacity="0.8"/>
        <text x="55" y="35" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">AVI VIDEO</text>
        <text x="15" y="225" fill="#f8fafc" font-family="Outfit, sans-serif" font-size="14" font-weight="600">recovered_000c22c000.avi</text>
        <text x="15" y="246" fill="#94a3b8" font-family="monospace" font-size="11">Dimensions: 640 x 480 (VGA)</text>
        <text x="15" y="266" fill="#94a3b8" font-family="monospace" font-size="11">Duration: 41.0 seconds</text>
        <text x="15" y="286" fill="#94a3b8" font-family="monospace" font-size="11">Size: 19.5 MB | Track: MJPEG</text>
        <text x="15" y="306" fill="#94a3b8" font-family="monospace" font-size="11">Offset: 0x000c22c000 (Sector 397,664)</text>
        <rect x="15" y="325" width="235" height="28" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1"/>
        <text x="132" y="343" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">✓ Playable RIFF Video Track</text>
      </g>

      <!-- Card 4: Action Cam Photo -->
      <g transform="translate(855, 0)">
        <rect width="265" height="370" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
        <rect x="10" y="10" width="245" height="190" rx="8" fill="#1e293b"/>
