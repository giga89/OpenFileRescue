      <rect x="0" y="0" width="180" height="32" rx="8" fill="url(#primaryGrad)"/>
      <text x="90" y="21" fill="#ffffff" font-family="Outfit, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Export All Files (Free)</text>
    </g>

