      <!-- Card 1: 48MP Photo -->
      <g transform="translate(0, 0)">
        <rect width="265" height="370" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
        <!-- Photo Preview Area -->
        <rect x="10" y="10" width="245" height="190" rx="8" fill="#1e293b"/>
        <!-- SVG Photo Art (Mountain Landscape) -->
        <path d="M10 150 L80 90 L130 130 L190 70 L255 160 L255 200 L10 200 Z" fill="#334155"/>
        <path d="M50 160 L120 110 L170 140 L220 100 L255 170 L255 200 L50 200 Z" fill="#475569"/>
        <circle cx="210" cy="50" r="16" fill="#fbbf24" fill-opacity="0.8"/>
        <!-- Badge -->
        <rect x="20" y="20" width="55" height="22" rx="4" fill="#0f172a" fill-opacity="0.8"/>
        <text x="47" y="35" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">JPEG</text>
        <!-- Info -->
        <text x="15" y="225" fill="#f8fafc" font-family="Outfit, sans-serif" font-size="14" font-weight="600">recovered_0002fd4000.jpg</text>
        <text x="15" y="246" fill="#94a3b8" font-family="monospace" font-size="11">Resolution: 8000 x 6000 (48 MP)</text>
        <text x="15" y="266" fill="#94a3b8" font-family="monospace" font-size="11">Camera: Kids Camera KC-2026</text>
        <text x="15" y="286" fill="#94a3b8" font-family="monospace" font-size="11">Size: 986.1 KB | Intact: 100%</text>
        <text x="15" y="306" fill="#94a3b8" font-family="monospace" font-size="11">Offset: 0x0002fd4000 (Sector 97,952)</text>
        <!-- Status Pill -->
        <rect x="15" y="325" width="235" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="132" y="343" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">✓ EXIF Verified &amp; Decoded</text>
      </g>

      <!-- Card 2: Beach Sunset Photo -->
      <g transform="translate(285, 0)">
        <rect width="265" height="370" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
        <rect x="10" y="10" width="245" height="190" rx="8" fill="#1e293b"/>
        <!-- SVG Sunset Art -->
        <path d="M10 160 Q 130 140 255 160 L255 200 L10 200 Z" fill="#0284c7"/>
        <circle cx="130" cy="110" r="28" fill="#f97316"/>
        <rect x="20" y="20" width="55" height="22" rx="4" fill="#0f172a" fill-opacity="0.8"/>
        <text x="47" y="35" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">JPEG</text>
        <text x="15" y="225" fill="#f8fafc" font-family="Outfit, sans-serif" font-size="14" font-weight="600">recovered_00034a1200.jpg</text>
        <text x="15" y="246" fill="#94a3b8" font-family="monospace" font-size="11">Resolution: 8000 x 6000 (48 MP)</text>
        <text x="15" y="266" fill="#94a3b8" font-family="monospace" font-size="11">Camera: Kids Camera KC-2026</text>
        <text x="15" y="286" fill="#94a3b8" font-family="monospace" font-size="11">Size: 1.02 MB | Intact: 100%</text>
        <text x="15" y="306" fill="#94a3b8" font-family="monospace" font-size="11">Offset: 0x00034a1200 (Sector 107,785)</text>
        <rect x="15" y="325" width="235" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="132" y="343" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">✓ EXIF Verified &amp; Decoded</text>
      </g>

      <!-- Card 3: AVI Video -->
      <g transform="translate(570, 0)">
        <rect width="265" height="370" rx="12" fill="url(#cardBg)" stroke="#6366f1" stroke-width="1.5"/>
        <rect x="10" y="10" width="245" height="190" rx="8" fill="#1e1b4b"/>
        <!-- Video Play Icon -->
