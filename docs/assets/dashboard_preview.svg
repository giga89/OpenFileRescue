<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2333" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#141c2b" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" fill="url(#bg)" rx="16"/>

  <!-- Top Window Bar -->
  <rect width="1200" height="40" fill="#0f172a" rx="16"/>
  <rect y="30" width="1200" height="10" fill="#0f172a"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444"/>
  <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="20" r="6" fill="#10b981"/>
  <text x="600" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" font-weight="500">OpenFileRescue Web UI Dashboard — http://127.0.0.1:8765</text>

  <!-- Header -->
  <g transform="translate(40, 60)">
    <!-- Google-Style Flat Logo Icon -->
    <g transform="translate(0, 0)">
      <rect width="44" height="44" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <!-- Mini Google-style flat lifebuoy ring -->
      <g transform="translate(22, 22) scale(0.08)">
        <path d="M -134.35 -134.35 A 190 190 0 0 1 134.35 -134.35 L 77.78 -77.78 A 110 110 0 0 0 -77.78 -77.78 Z" fill="#4285F4"/>
        <path d="M 134.35 -134.35 A 190 190 0 0 1 134.35 134.35 L 77.78 77.78 A 110 110 0 0 0 77.78 -77.78 Z" fill="#FBBC05"/>
        <path d="M 134.35 134.35 A 190 190 0 0 1 -134.35 134.35 L -77.78 77.78 A 110 110 0 0 0 77.78 77.78 Z" fill="#34A853"/>
        <path d="M -134.35 134.35 A 190 190 0 0 1 -134.35 -134.35 L -77.78 -77.78 A 110 110 0 0 0 -77.78 -77.78 Z" fill="#EA4335"/>
        <rect x="-8" y="-195" width="16" height="90" rx="4" fill="#FFFFFF"/>
        <rect x="-8" y="105" width="16" height="90" rx="4" fill="#FFFFFF"/>
        <rect x="-195" y="-8" width="90" height="16" rx="4" fill="#FFFFFF"/>
        <rect x="105" y="-8" width="90" height="16" rx="4" fill="#FFFFFF"/>
      </g>
      <!-- Center white card -->
      <rect x="16" y="15" width="12" height="14" rx="2" fill="#FFFFFF"/>
      <circle cx="22" cy="22" r="2.5" fill="#34A853"/>
    </g>

    <!-- Brand Name & Badges (Cleanly separated without any overlap) -->
    <text x="56" y="27" fill="#f8fafc" font-family="Outfit, -apple-system, sans-serif" font-size="22" font-weight="700">OpenFileRescue</text>
    
    <rect x="238" y="11" width="145" height="22" rx="11" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <text x="310" y="26" fill="#fbbf24" font-family="sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Work in Progress (Alpha)</text>

    <rect x="393" y="11" width="148" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="467" y="26" fill="#34d399" font-family="sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">100% Free &amp; Open Source</text>

    <text x="56" y="44" fill="#64748b" font-family="sans-serif" font-size="11">Open-source photo, video, and data recovery for MicroSD cards, flash drives, and disk images</text>

    <!-- Safe Mode Pill -->
    <rect x="940" y="8" width="180" height="28" rx="14" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="1"/>
    <circle cx="958" cy="22" r="4" fill="#10b981"/>
    <text x="970" y="26" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">Safe Mode (Read-Only)</text>
  </g>

  <!-- Telemetry Bar (4 Cards) -->
  <g transform="translate(40, 120)">
    <!-- Card 1: Read Speed -->
    <rect x="0" y="0" width="265" height="75" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">READ THROUGHPUT</text>
    <text x="20" y="58" fill="#38bdf8" font-family="Outfit, sans-serif" font-size="26" font-weight="700">18.2 MB/s</text>

    <!-- Card 2: Files Found -->
    <rect x="285" y="0" width="265" height="75" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="305" y="28" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">FILES RESURRECTED</text>
    <text x="305" y="58" fill="#10b981" font-family="Outfit, sans-serif" font-size="26" font-weight="700">1,392 files</text>
    <text x="440" y="56" fill="#64748b" font-family="sans-serif" font-size="12">(980.3 MB)</text>

    <!-- Card 3: Formats Breakdown -->
    <rect x="570" y="0" width="265" height="75" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="590" y="28" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">FORMAT BREAKDOWN</text>
    <text x="590" y="58" fill="#f8fafc" font-family="Outfit, sans-serif" font-size="20" font-weight="600">1,391 JPG <tspan fill="#64748b" font-size="14">| 1 AVI</tspan></text>

    <!-- Card 4: Integrity Status -->
    <rect x="855" y="0" width="265" height="75" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="875" y="28" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="500">HARDWARE INTEGRITY</text>
    <text x="875" y="58" fill="#34d399" font-family="Outfit, sans-serif" font-size="22" font-weight="700">0 Bad Blocks</text>
    <text x="1040" y="56" fill="#64748b" font-family="sans-serif" font-size="12">(100% Intact)</text>
  </g>

  <!-- LBA Sector Grid Map (Defrag Style) -->
  <g transform="translate(40, 215)">
    <rect x="0" y="0" width="1120" height="90" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="26" fill="#f8fafc" font-family="Outfit, sans-serif" font-size="14" font-weight="600">Physical LBA Address Space — Sector Allocation Matrix (\\.\D: Kids Camera 29.11 GB)</text>
    
    <!-- Sector Grid Matrix (Blocks) -->
    <g transform="translate(20, 42)">
      <!-- 50 sample colored blocks showing file distribution -->
      <!-- Green = Recovered File Sectors, Blue = Scanned, Dark = Free -->
      <rect x="0" y="0" width="18" height="14" rx="2" fill="#10b981"/>
      <rect x="22" y="0" width="18" height="14" rx="2" fill="#10b981"/>
      <rect x="44" y="0" width="18" height="14" rx="2" fill="#059669"/>
