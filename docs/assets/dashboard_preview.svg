      <rect x="770" y="0" width="18" height="14" rx="2" fill="#334155"/>
      <rect x="792" y="0" width="18" height="14" rx="2" fill="#334155"/>
      <rect x="814" y="0" width="18" height="14" rx="2" fill="#334155"/>
      <rect x="836" y="0" width="18" height="14" rx="2" fill="#334155"/>
      <rect x="858" y="0" width="18" height="14" rx="2" fill="#334155"/>
      <rect x="880" y="0" width="18" height="14" rx="2" fill="#334155"/>
      <rect x="902" y="0" width="18" height="14" rx="2" fill="#334155"/>
      <rect x="924" y="0" width="18" height="14" rx="2" fill="#334155"/>
      <rect x="946" y="0" width="18" height="14" rx="2" fill="#334155"/>
      <rect x="968" y="0" width="18" height="14" rx="2" fill="#334155"/>
      <rect x="990" y="0" width="18" height="14" rx="2" fill="#334155"/>
      <rect x="1012" y="0" width="18" height="14" rx="2" fill="#334155"/>
      <rect x="1034" y="0" width="18" height="14" rx="2" fill="#334155"/>
      <rect x="1056" y="0" width="18" height="14" rx="2" fill="#334155"/>
    </g>

    <!-- Legend -->
    <g transform="translate(20, 68)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="#10b981"/>
      <text x="14" y="8" fill="#94a3b8" font-family="sans-serif" font-size="10">Recovered File Clusters</text>

      <rect x="160" y="0" width="8" height="8" rx="2" fill="#38bdf8"/>
      <text x="174" y="8" fill="#94a3b8" font-family="sans-serif" font-size="10">Scanned Clean</text>

      <rect x="280" y="0" width="8" height="8" rx="2" fill="#6366f1"/>
      <text x="294" y="8" fill="#94a3b8" font-family="sans-serif" font-size="10">Video Stream</text>

      <rect x="390" y="0" width="8" height="8" rx="2" fill="#334155"/>
      <text x="404" y="8" fill="#94a3b8" font-family="sans-serif" font-size="10">Pending / Unallocated</text>
    </g>
  </g>

  <!-- Live Discovery Gallery & Lightbox Preview -->
  <g transform="translate(40, 325)">
    <!-- Header with Tabs and Export Action -->
    <text x="0" y="24" fill="#f8fafc" font-family="Outfit, sans-serif" font-size="18" font-weight="700">Live Resurrected Files (1,392)</text>
    
    <!-- Filter Tabs -->
    <g transform="translate(300, 5)">
      <rect x="0" y="0" width="60" height="26" rx="6" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
      <text x="30" y="17" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">All (1392)</text>

      <rect x="70" y="0" width="85" height="26" rx="6" fill="#1e293b"/>
      <text x="112" y="17" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle">Photos (1391)</text>

      <rect x="165" y="0" width="75" height="26" rx="6" fill="#1e293b"/>
      <text x="202" y="17" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle">Videos (1)</text>
    </g>

    <!-- Export Button -->
