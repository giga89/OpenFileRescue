<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="showcase_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" rx="16" fill="url(#showcase_bg)"/>

  <!-- Title Header -->
  <text x="600" y="55" fill="#F8FAFC" font-family="'Outfit', -apple-system, sans-serif" font-size="28" font-weight="700" text-anchor="middle">OpenFileRescue — Logo Design Concepts</text>
  <text x="600" y="85" fill="#94A3B8" font-family="sans-serif" font-size="14" text-anchor="middle">Flat, Modern, Google-Inspired Metaphors for Real Data Recovery</text>

  <!-- ==================== OPTION 1 ==================== -->
  <g transform="translate(45, 125)">
    <rect width="260" height="500" rx="16" fill="url(#card_bg)" stroke="#334155" stroke-width="1.5"/>
    <text x="130" y="38" fill="#38BDF8" font-family="Outfit, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Option A</text>
    <text x="130" y="62" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">"The Healed File"</text>
    <text x="130" y="82" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Reconstruction &amp; Pixel Assembly</text>

    <!-- Embedded Icon Thumbnail -->
    <g transform="translate(35, 110) scale(0.37)">
      <rect width="512" height="512" rx="80" fill="#0f172a" stroke="#334155" stroke-width="4"/>
      <!-- Pixels -->
      <g fill="#475569" opacity="0.6">
        <rect x="70" y="320" width="22" height="22" rx="4"/>
        <rect x="102" y="350" width="26" height="26" rx="4"/>
        <rect x="74" y="380" width="20" height="20" rx="4"/>
      </g>
      <rect x="120" y="330" width="24" height="24" rx="4" fill="#4285F4"/>
      <rect x="140" y="370" width="26" height="26" rx="4" fill="#34A853"/>
      <!-- File -->
      <path d="M 170 100 C 170 88 180 75 194 75 L 330 75 L 400 145 L 400 410 C 400 422 390 435 376 435 L 194 435 C 180 435 170 422 170 410 Z" fill="#F8FAFC"/>
      <path d="M 330 75 L 330 130 C 330 138 337 145 346 145 L 400 145 Z" fill="#FBBC05"/>
      <!-- Mountain in file -->
      <circle cx="330" cy="225" r="16" fill="#FBBC05"/>
      <path d="M 205 315 L 255 250 A 6 6 0 0 1 265 250 L 315 315 Z" fill="#4285F4"/>
      <path d="M 260 315 L 295 265 A 6 6 0 0 1 305 265 L 340 315 Z" fill="#34A853"/>
      <!-- Sweep Arrow -->
      <path d="M 60 410 C 80 470 200 480 290 440 C 370 405 440 310 440 210 C 440 140 400 90 350 70" fill="none" stroke="#34A853" stroke-width="24" stroke-linecap="round"/>
      <polygon points="370,45 330,75 365,100" fill="#FBBC05"/>
    </g>

    <!-- Description -->
    <text x="25" y="340" fill="#CBD5E1" font-family="sans-serif" font-size="12" font-weight="600">Visual Metaphor:</text>
    <text x="25" y="362" fill="#94A3B8" font-family="sans-serif" font-size="11">Fragments of lost bytes/pixels</text>
    <text x="25" y="380" fill="#94A3B8" font-family="sans-serif" font-size="11">are dynamically reassembled</text>
    <text x="25" y="398" fill="#94A3B8" font-family="sans-serif" font-size="11">by the recovery swoosh into</text>
    <text x="25" y="416" fill="#94A3B8" font-family="sans-serif" font-size="11">an intact, verified file.</text>

    <text x="25" y="450" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="600">Highlights:</text>
    <text x="25" y="470" fill="#E2E8F0" font-family="sans-serif" font-size="11">✓ Instant "healing" vibe</text>
    <text x="25" y="490" fill="#E2E8F0" font-family="sans-serif" font-size="11">✓ Dynamic motion</text>
  </g>

  <!-- ==================== OPTION 2 ==================== -->
  <g transform="translate(330, 125)">
    <rect width="260" height="500" rx="16" fill="url(#card_bg)" stroke="#10b981" stroke-width="2"/>
    <!-- Popular / Recommended Tag -->
    <rect x="75" y="-12" width="110" height="24" rx="12" fill="#10B981"/>
    <text x="130" y="4" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">RECOMMENDED</text>

    <text x="130" y="38" fill="#34D399" font-family="Outfit, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Option B</text>
    <text x="130" y="62" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">"The Restore Loop"</text>
    <text x="130" y="82" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Storage Card &amp; Circular Undo</text>

    <!-- Embedded Icon Thumbnail -->
    <g transform="translate(35, 110) scale(0.37)">
      <rect width="512" height="512" rx="80" fill="#0f172a" stroke="#334155" stroke-width="4"/>
      <!-- MicroSD base -->
      <path d="M 190 116 L 322 116 A 20 20 0 0 1 342 136 L 342 376 A 20 20 0 0 1 322 396 L 186 396 A 20 20 0 0 1 166 376 L 166 161 L 190 131 Z" fill="#1e293b" stroke="#475569" stroke-width="3"/>
      <!-- Gold Pins -->
      <rect x="196" y="136" width="14" height="28" rx="4" fill="#FBBC05"/>
      <rect x="220" y="136" width="14" height="28" rx="4" fill="#FBBC05"/>
      <rect x="244" y="136" width="14" height="28" rx="4" fill="#FBBC05"/>
      <rect x="268" y="136" width="14" height="28" rx="4" fill="#FBBC05"/>
      <rect x="292" y="136" width="14" height="28" rx="4" fill="#FBBC05"/>
      <!-- File emerging -->
      <path d="M 196 175 C 196 166 203 160 212 160 L 276 160 L 316 200 L 316 304 C 316 313 309 320 300 320 L 212 320 C 203 320 196 313 196 304 Z" fill="#F8FAFC"/>
      <path d="M 276 160 L 276 192 C 276 196 280 200 284 200 L 316 200 Z" fill="#4285F4"/>
      <!-- Photo inside file -->
      <circle cx="281" cy="240" r="12" fill="#FBBC05"/>
      <path d="M 216 295 L 246 250 A 4 4 0 0 1 254 250 L 284 295 Z" fill="#4285F4"/>
      <path d="M 251 295 L 271 265 A 4 4 0 0 1 279 265 L 301 295 Z" fill="#34A853"/>
      <!-- Circular 3-Color Restore Arrow -->
      <path d="M 256 56 A 200 200 0 0 1 456 256" fill="none" stroke="#4285F4" stroke-width="26" stroke-linecap="round"/>
      <path d="M 456 256 A 200 200 0 0 1 256 456" fill="none" stroke="#34A853" stroke-width="26" stroke-linecap="round"/>
      <path d="M 256 456 A 200 200 0 0 1 70 320" fill="none" stroke="#FBBC05" stroke-width="26" stroke-linecap="round"/>
      <polygon points="268,32 220,56 268,80" fill="#4285F4"/>
    </g>

    <!-- Description -->
    <text x="25" y="340" fill="#CBD5E1" font-family="sans-serif" font-size="12" font-weight="600">Visual Metaphor:</text>
    <text x="25" y="362" fill="#94A3B8" font-family="sans-serif" font-size="11">The universal circular "Undo /</text>
    <text x="25" y="380" fill="#94A3B8" font-family="sans-serif" font-size="11">Restore" arrow loops around</text>
    <text x="25" y="398" fill="#94A3B8" font-family="sans-serif" font-size="11">the microSD, resurrecting the</text>
    <text x="25" y="416" fill="#94A3B8" font-family="sans-serif" font-size="11">file from the memory chip.</text>

    <text x="25" y="450" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="600">Highlights:</text>
    <text x="25" y="470" fill="#E2E8F0" font-family="sans-serif" font-size="11">✓ Universally understood "Restore"</text>
    <text x="25" y="490" fill="#E2E8F0" font-family="sans-serif" font-size="11">✓ Clear hardware connection</text>
  </g>

  <!-- ==================== OPTION 3 ==================== -->
  <g transform="translate(615, 125)">
    <rect width="260" height="500" rx="16" fill="url(#card_bg)" stroke="#334155" stroke-width="1.5"/>
    <text x="130" y="38" fill="#A855F7" font-family="Outfit, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Option C</text>
    <text x="130" y="62" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">"Digital First-Aid"</text>
    <text x="130" y="82" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Emergency Rescue Cross</text>

    <!-- Embedded Icon Thumbnail -->
    <g transform="translate(35, 110) scale(0.37)">
      <rect width="512" height="512" rx="80" fill="#0f172a" stroke="#334155" stroke-width="4"/>
      <!-- File -->
      <path d="M 136 90 C 136 77 147 66 160 66 L 296 66 L 376 146 L 376 422 C 376 435 365 446 352 446 L 160 446 C 147 446 136 435 136 422 Z" fill="#F8FAFC"/>
      <path d="M 296 66 L 296 130 C 296 138 303 146 312 146 L 376 146 Z" fill="#4285F4"/>
      <!-- 4-Color Rescue Cross -->
      <g transform="translate(256, 296)">
        <rect x="-24" y="-80" width="48" height="60" rx="12" fill="#4285F4"/>
        <rect x="-24" y="20" width="48" height="60" rx="12" fill="#34A853"/>
        <rect x="-80" y="-24" width="60" height="48" rx="12" fill="#EA4335"/>
        <rect x="20" y="-24" width="60" height="48" rx="12" fill="#FBBC05"/>
        <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#1A73E8"/>
        <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
      </g>
      <!-- Lifeline -->
      <path d="M 60 410 L 160 410 L 185 360 L 210 450 L 235 390 L 255 410 L 452 410" fill="none" stroke="#34A853" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Description -->
    <text x="25" y="340" fill="#CBD5E1" font-family="sans-serif" font-size="12" font-weight="600">Visual Metaphor:</text>
    <text x="25" y="362" fill="#94A3B8" font-family="sans-serif" font-size="11">Data recovery framed as a</text>
    <text x="25" y="380" fill="#94A3B8" font-family="sans-serif" font-size="11">"First-Aid Kit / Hospital" for</text>
    <text x="25" y="398" fill="#94A3B8" font-family="sans-serif" font-size="11">damaged and failing media,</text>
    <text x="25" y="416" fill="#94A3B8" font-family="sans-serif" font-size="11">with an active pulse lifeline.</text>

    <text x="25" y="450" fill="#A855F7" font-family="sans-serif" font-size="11" font-weight="600">Highlights:</text>
    <text x="25" y="470" fill="#E2E8F0" font-family="sans-serif" font-size="11">✓ Very strong "Rescue" feeling</text>
    <text x="25" y="490" fill="#E2E8F0" font-family="sans-serif" font-size="11">✓ Clean Google-colored cross</text>
  </g>

  <!-- ==================== OPTION 4 ==================== -->
  <g transform="translate(900, 125)">
    <rect width="260" height="500" rx="16" fill="url(#card_bg)" stroke="#334155" stroke-width="1.5"/>
    <text x="130" y="38" fill="#F59E0B" font-family="Outfit, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Option D</text>
    <text x="130" y="62" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">"Radar Sector Carver"</text>
    <text x="130" y="82" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">LBA Sweep &amp; Discovery</text>

    <!-- Embedded Icon Thumbnail -->
    <g transform="translate(35, 110) scale(0.37)">
      <rect width="512" height="512" rx="80" fill="#0f172a" stroke="#334155" stroke-width="4"/>
      <!-- Radar Rings -->
      <circle cx="256" cy="256" r="200" fill="none" stroke="#1e293b" stroke-width="4"/>
      <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="4"/>
      <!-- Sweep -->
      <path d="M 256 256 L 390 100 A 200 200 0 0 0 100 130 Z" fill="#38BDF8" fill-opacity="0.3"/>
      <line x1="256" y1="256" x2="390" y2="100" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
      <!-- Center Resurrected Photo -->
      <path d="M 176 150 C 176 139 185 130 196 130 L 286 130 L 336 180 L 336 322 C 336 333 327 342 316 342 L 196 342 C 185 342 176 333 176 322 Z" fill="#F8FAFC"/>
      <path d="M 286 130 L 286 168 C 286 174 291 180 298 180 L 336 180 Z" fill="#FBBC05"/>
      <!-- Photo inside -->
      <rect x="200" y="190" width="112" height="90" rx="8" fill="#E2E8F0"/>
      <circle cx="262" cy="216" r="11" fill="#FBBC05"/>
      <path d="M 210 280 L 245 235 A 4 4 0 0 1 251 235 L 286 280 Z" fill="#4285F4"/>
      <path d="M 248 280 L 272 248 A 4 4 0 0 1 278 248 L 302 280 Z" fill="#34A853"/>
      <!-- Green check -->
      <circle cx="316" cy="310" r="22" fill="#34A853"/>
      <path d="M 306 310 L 313 317 L 327 303" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Description -->
    <text x="25" y="340" fill="#CBD5E1" font-family="sans-serif" font-size="12" font-weight="600">Visual Metaphor:</text>
    <text x="25" y="362" fill="#94A3B8" font-family="sans-serif" font-size="11">Directly mirrors the tool's</text>
    <text x="25" y="380" fill="#94A3B8" font-family="sans-serif" font-size="11">real-time LBA sector map:</text>
    <text x="25" y="398" fill="#94A3B8" font-family="sans-serif" font-size="11">a deep radar beam scans the</text>
    <text x="25" y="416" fill="#94A3B8" font-family="sans-serif" font-size="11">dark sectors and illuminates data.</text>

    <text x="25" y="450" fill="#F59E0B" font-family="sans-serif" font-size="11" font-weight="600">Highlights:</text>
    <text x="25" y="470" fill="#E2E8F0" font-family="sans-serif" font-size="11">✓ Tech/forensic authenticity</text>
    <text x="25" y="490" fill="#E2E8F0" font-family="sans-serif" font-size="11">✓ Highlights deep scan engine</text>
  </g>
</svg>
