name: Feature / Parser Request
description: Suggest a new file format parser or feature for OpenFileRescue
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Share your ideas for new formats or features!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature / Format Description
      description: What file format (e.g. specialized camera RAW, audio format) or feature would you like to see?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case & Real-World Context
      description: Explain how this feature helps data recovery scenarios.
    validations:
      required: false
